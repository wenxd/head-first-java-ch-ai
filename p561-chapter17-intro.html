  <h1>让整首歌播放</h1>
  <p class="annot">（本章为联网版 BeatBox 蓄力：多人与服务器通信。）</p>

  <p>你已经会做 GUI、会保存节拍，现在要让它们在<strong>不同电脑之间共享</strong>。这需要两件事：一套联网的能力（把节拍发给服务器、再让别的客户端收），以及并发的头脑（多个任务同时进行——你的音乐在播放的同时，你的界面还在响应用户）。</p>
